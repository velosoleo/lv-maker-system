body {

header {

    justify-content: space-between;

header h1 { font-size: 20px; }

.carrinho-btn {

    border-radius: 20px;

}

.banner {
    position: relative;
    width: 100%;
    max-height: 500px;
    overflow: hidden;
}

.banner img {
    width: 100%;
    max-height: 500px;
    object-fit: cover;

}

.banner-texto {
    position: absolute;
    bottom: 0; left: 0; right: 0;

}

.categorias-bar {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    overflow-x: auto;
    background: white;
    border-bottom: 1px solid #eee;
}

.cat-btn {
    background: #f4f6f9;
    border: 1px solid #ddd;
    padding: 6px 14px;

}

.cat-btn.ativo {
    background: #0f243e;

}

.produtos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));

    padding: 20px;
}

.produto-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
}

.galeria-principal {
    position: relative;
    cursor: pointer;
}

.galeria-principal img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
}

.galeria-badge {
    position: absolute;
    bottom: 6px;
    right: 8px;
    background: rgba(0,0,0,0.55);

    font-size: 11px;
    padding: 2px 7px;

}

.produto-sem-foto {
    width: 100%;
    height: 180px;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 13px;
}

.produto-info {
    padding: 12px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.produto-info strong {
    display: block;
    font-size: 15px;

}

.categoria-tag {
    font-size: 11px;
    color: white;
    background: #4fc3f7;
    border-radius: 10px;
    padding: 2px 8px;
    display: inline-block;
    margin-bottom: 8px;
    align-self: flex-start;
}

.disponibilidade-tag {
    font-size: 11px;
    border-radius: 10px;
    padding: 3px 8px;
    display: inline-block;

    align-self: flex-start;

}

.disponibilidade-tag.pronta {
    color: #0b5d1e;

}

.disponibilidade-tag.demanda {

}

.descricao-wrap {

    color: #555;
    margin-bottom: 8px;

}

.descricao-texto {
    display: -webkit-box;

}

.descricao-texto.expandido {
    display: block;

.btn-ver-mais {

.btn-add {

}

.btn-add:hover { background: #1b3a5a; }

.btn-add:disabled {
    background: #ccc;

}

.modal-foto {

    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 500;

}

.modal-foto.aberto { display: flex; }

.modal-foto img {
    max-width: 92vw;

}

.modal-nav {
    display: flex;

    margin-top: 16px;
}

.modal-nav button {
    background: rgba(255,255,255,0.15);

    color: white;

}

.modal-nav button:hover { background: rgba(255,255,255,0.3); }

.modal-contador {

}

.modal-fechar {

.carrinho-panel {

}

.carrinho-header button {

.carrinho-itens {

.item-info { flex: 1; }
.item-info strong { font-size: 13px; }
.item-info span { font-size: 12px; color: #555; display: block; }

}

.item-qtd button {

    border-radius: 50%;

}

.item-qtd button:disabled {

}

.carrinho-footer {

.btn-finalizar {

    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-finalizar:hover { background: #1da851; }

.btn-continuar {
    width: 100%;
    background: white;
    color: #0f243e;
    border: 1px solid #0f243e;
    padding: 10px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 8px;
}

.btn-continuar:hover {
    background: #f4f6f9;
}

.carrinho-vazio {
    text-align: center;
    color: #999;
    margin-top: 40px;
}

.badge {
    background: #e74c3c;
    color: white;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 12px;
    margin-left: 4px;
}

.form-pedido {
    padding: 12px 16px;
    border-top: 1px solid #eee;
}

.form-pedido input,
.form-pedido textarea {
    width: 100%;
    padding: 8px;
    margin: 4px 0;
    border: 1px solid #ccc;
    border-radius: 6px;

}

.form-pedido textarea {
    resize: vertical;
    min-height: 60px;
}

.form-pedido label {
    font-size: 12px;

}

.sugestao-card {
    background: white;
    border-radius: 12px;
    margin: 20px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.sugestao-card h3 {

}

.sugestao-card p {

}

.sugestao-card textarea,

    <button class="carrinho-btn" onclick="abrirCarrinho()">
        🛒 Carrinho <span class="badge" id="badgeQtd">0</span>

</div>

<div class="categorias-bar" id="categoriasBar" style="display:none;">
    <button class="cat-btn ativo" onclick="filtrarCategoria('', this)">Todos</button>

        <button onclick="navModal(1)">›</button>

        <span>🛒 Meu Carrinho</span>
        <button onclick="fecharCarrinho()">✕</button>
    </div>

    <div class="carrinho-itens" id="carrinhoItens">
        <p class="carrinho-vazio">Seu carrinho está vazio.</p>

            <span>R$ <span id="totalCarrinho">0,00</span></span>

            📲 Enviar Pedido no WhatsApp
        </button>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyASqz8XoAhyD6w-klOr4HXlj_4URkQlBU8",
    authDomain: "lv-maker.firebaseapp.com",
    projectId: "lv-maker",
    storageBucket: "lv-maker.firebasestorage.app",
    messagingSenderId: "216355482221",
    appId: "1:216355482221:web:5c3806b990538fa7dc6d64"
};

firebase.initializeApp(firebaseConfig);
const appCheck = firebase.appCheck();
appCheck.activate(
    new firebase.appCheck.ReCaptchaEnterpriseProvider("6LcX5IItAAAAAMMojs5eGD6mDUWpnFozv-P_xmC_"),
    true
);
const db = firebase.firestore();

const SEU_WHATSAPP = "5547992027726";

let carrinho = [];
let todosProdutos = [];
let categoriaAtiva = "";

let fotoAtual = 0;
let fotosModal = [];

function escaparHTML(valor) {
    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function abrirModal(fotos, indice) {
    fotosModal = fotos;
    fotoAtual = indice;
    document.getElementById("modalImg").src = fotosModal[fotoAtual];
    document.getElementById("modalContador").innerText = `${fotoAtual + 1} / ${fotosModal.length}`;
    document.getElementById("modalFoto").classList.add("aberto");
    document.getElementById("modalFoto").querySelector(".modal-nav").style.display =
        fotosModal.length > 1 ? "flex" : "none";
}

function fecharModal() {
    document.getElementById("modalFoto").classList.remove("aberto");
}

function navModal(dir) {
    fotoAtual = (fotoAtual + dir + fotosModal.length) % fotosModal.length;
    document.getElementById("modalImg").src = fotosModal[fotoAtual];
    document.getElementById("modalContador").innerText = `${fotoAtual + 1} / ${fotosModal.length}`;
}

function abrirModalProduto(docId, indice) {
    const produto = todosProdutos.find(p => p.docId === docId);
    if (!produto) return;
    abrirModal(produto.fotos || [], indice);
}

document.getElementById("modalFoto").addEventListener("click", function(e) {
    if (e.target === this) fecharModal();
});

async function carregarBanner() {
    try {
        const doc = await db.collection("configuracoes").doc("banner").get();
        if (doc.exists) {
            const b = doc.data();
            if (b.ativo && b.imagemURL) {
                document.getElementById("bannerImg").src = b.imagemURL;
                document.getElementById("bannerTexto").innerText = b.texto || "";
                document.getElementById("banner").style.display = "block";
            }
        }
    } catch(e) {}
}

async function carregarProdutos() {
    const snapshot = await db.collection("produtos")
        .where("ativo", "==", true)
        .orderBy("criadoEm", "desc")
        .get();

    document.getElementById("loading").style.display = "none";
    todosProdutos = [];
    const categorias = new Set();

    snapshot.forEach(doc => {
        const p = doc.data();
        p.docId = doc.id;
        if (!p.fotos || p.fotos.length === 0) {
            p.fotos = p.fotoURL ? [p.fotoURL] : [];
        }
        todosProdutos.push(p);
        if (p.categoria) categorias.add(p.categoria);
    });

    if (categorias.size > 0) {
        const bar = document.getElementById("categoriasBar");
        bar.style.display = "flex";
        categorias.forEach(cat => {
            const btn = document.createElement("button");
            btn.className = "cat-btn";
            btn.innerText = cat;
            btn.onclick = () => filtrarCategoria(cat, btn);
            bar.appendChild(btn);
        });
    }

    renderProdutos();
}

function filtrarCategoria(categoria, btnClicado) {
    categoriaAtiva = categoria;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("ativo"));
    btnClicado.classList.add("ativo");
    renderProdutos();
}

function toggleDescricao(btn, textoEl) {
    const expandido = textoEl.classList.toggle("expandido");
    btn.innerText = expandido ? "Ver menos" : "Ver mais";
}

function renderProdutos() {
    const grid = document.getElementById("produtosGrid");
    grid.innerHTML = "";

    const filtrados = categoriaAtiva
        ? todosProdutos.filter(p => p.categoria === categoriaAtiva)
        : todosProdutos;

    if (filtrados.length === 0) {
        grid.innerHTML = "<p style='padding:20px;color:#999;'>Nenhum produto disponível.</p>";
        return;
    }

    filtrados.forEach(p => {
        const fotos = p.fotos || [];
        const descricaoId = `desc-${p.docId}`;
        const btnId = `btn-${p.docId}`;
        const temDescricaoLonga = p.descricao && p.descricao.length > 80;
        const disponibilidade = p.disponibilidade || "sob_demanda";
        const estoquePronto = Number(p.estoquePronto || 0);
        const semEstoquePronto = disponibilidade === "pronta_entrega" && estoquePronto <= 0;
        const textoDisponibilidade = disponibilidade === "pronta_entrega"
            ? (estoquePronto > 0 ? `Pronta entrega: ${estoquePronto} un.` : "Pronta entrega: esgotado")
            : "Sob demanda";
        const classeDisponibilidade = disponibilidade === "pronta_entrega" ? "pronta" : "demanda";

        const card = document.createElement("div");
        card.className = "produto-card";
        card.innerHTML = `
            ${fotos.length > 0
                ? `<div class="galeria-principal" onclick="abrirModalProduto('${p.docId}', 0)">
                    <img src="${escaparHTML(fotos[0])}" alt="${escaparHTML(p.nome)}">
                    ${fotos.length > 1 ? `<span class="galeria-badge">📷 ${fotos.length}</span>` : ""}
                   </div>`
                : `<div class="produto-sem-foto">Sem foto</div>`}
            <div class="produto-info">
                <strong>${escaparHTML(p.nome)}</strong>
                ${p.categoria ? `<span class="categoria-tag">${escaparHTML(p.categoria)}</span>` : ""}
                <span class="disponibilidade-tag ${classeDisponibilidade}">${escaparHTML(textoDisponibilidade)}</span>
                ${p.descricao ? `
                <div class="descricao-wrap">
                    <span class="descricao-texto" id="${descricaoId}">${escaparHTML(p.descricao)}</span>
                    ${temDescricaoLonga ? `<button class="btn-ver-mais" id="${btnId}" onclick="toggleDescricao(document.getElementById('${btnId}'), document.getElementById('${descricaoId}'))">Ver mais</button>` : ""}
                </div>` : ""}
                <p class="preco">R$ ${Number(p.preco).toFixed(2)}</p>
                <button class="btn-add" onclick="adicionarCarrinhoPorId('${p.docId}')" ${semEstoquePronto ? "disabled" : ""}>
                    ${semEstoquePronto ? "Esgotado" : "+ Adicionar"}
                </button>
            </div>
        `;
        grid.appendChild(card);
    });
}

function adicionarCarrinhoPorId(docId) {
    const p = todosProdutos.find(produto => produto.docId === docId);
    if (!p) return;
    const fotos = p.fotos || [];
    adicionarCarrinho({
        docId: p.docId,
        nome: p.nome,
        preco: p.preco,
        fotoURL: fotos[0] || "",
        disponibilidade: p.disponibilidade || "sob_demanda",
        estoquePronto: Number(p.estoquePronto || 0)
    });
}

function limiteEstoque(produto) {
    if (produto.disponibilidade !== "pronta_entrega") return Infinity;
    return Number(produto.estoquePronto || 0);
}

function adicionarCarrinho(produto) {
    const existente = carrinho.find(i => i.produto.docId === produto.docId);
    const limite = limiteEstoque(produto);

    if (limite <= 0) {
        alert("Esse produto pronta entrega está esgotado.");
        return;
    }

    if (existente) {
        if (existente.qtd >= limite) {
            alert(`Você já adicionou a quantidade pronta disponível (${limite} un.).`);
            abrirCarrinho();
            return;
        }
        existente.qtd++;
    }
    else { carrinho.push({ produto, qtd: 1 }); }
    atualizarCarrinho();
    abrirCarrinho();
}

function removerItem(docId) {
    const idx = carrinho.findIndex(i => i.produto.docId === docId);
    if (idx === -1) return;
    if (carrinho[idx].qtd > 1) { carrinho[idx].qtd--; }
    else { carrinho.splice(idx, 1); }
    atualizarCarrinho();
}

function adicionarItem(docId) {
    const item = carrinho.find(i => i.produto.docId === docId);
    if (item) {
        const limite = limiteEstoque(item.produto);
        if (item.qtd >= limite) {
            alert(`Quantidade máxima pronta disponível: ${limite} un.`);
            return;
        }
        item.qtd++;
    }
    atualizarCarrinho();
}

function atualizarCarrinho() {
    const total = carrinho.reduce((acc, i) => acc + (i.produto.preco * i.qtd), 0);
    const qtdTotal = carrinho.reduce((acc, i) => acc + i.qtd, 0);

    document.getElementById("badgeQtd").innerText = qtdTotal;
    document.getElementById("totalCarrinho").innerText = total.toFixed(2).replace(".", ",");
    document.getElementById("formPedido").style.display = carrinho.length > 0 ? "block" : "none";

    const container = document.getElementById("carrinhoItens");
    if (carrinho.length === 0) {
        container.innerHTML = "<p class='carrinho-vazio'>Seu carrinho está vazio.</p>";
        return;
    }

    container.innerHTML = "";
    carrinho.forEach(i => {
        const limite = limiteEstoque(i.produto);
        const atingiuLimite = i.qtd >= limite;
        const div = document.createElement("div");
        div.className = "item-carrinho";
        div.innerHTML = `
            ${i.produto.fotoURL
                ? `<img src="${escaparHTML(i.produto.fotoURL)}" alt="${escaparHTML(i.produto.nome)}">`
                : `<div style="width:50px;height:50px;background:#ddd;border-radius:6px;"></div>`}
            <div class="item-info">
                <strong>${escaparHTML(i.produto.nome)}</strong>
                <span>R$ ${Number(i.produto.preco).toFixed(2)}</span>
                ${i.produto.disponibilidade === "pronta_entrega" ? `<span>Disponível: ${limite} un.</span>` : ""}
            </div>
            <div class="item-qtd">
                <button onclick="removerItem('${i.produto.docId}')">−</button>
                <span>${i.qtd}</span>
                <button onclick="adicionarItem('${i.produto.docId}')" ${atingiuLimite ? "disabled" : ""}>+</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function abrirCarrinho() {
    document.getElementById("carrinhoPanel").classList.add("aberto");
    document.getElementById("overlay").style.display = "block";
}

function fecharCarrinho() {
    document.getElementById("carrinhoPanel").classList.remove("aberto");
    document.getElementById("overlay").style.display = "none";
}

async function salvarPedidoCatalogo(nome, telefone, observacao, total) {
    const itens = carrinho.map(i => ({
        produtoId: i.produto.docId || "",
        nome: i.produto.nome || "",
        preco: Number(i.produto.preco || 0),
        qtd: Number(i.qtd || 0),
        subtotal: Number(i.produto.preco || 0) * Number(i.qtd || 0),
        disponibilidade: i.produto.disponibilidade || "sob_demanda"
    }));

    const doc = await db.collection("pedidosCatalogo").add({
        cliente: nome,
        telefone: telefone.replace(/\D/g, ""),
        observacao,
        itens,
        total,
        status: "novo",
        origem: "catalogo",
        criadoEm: new Date()
    });

    return doc.id;
}

async function finalizarPedido() {
    if (carrinho.length === 0) { alert("Seu carrinho está vazio."); return; }

    const nome = document.getElementById("nomeComprador").value.trim();
    const telefone = document.getElementById("telefoneComprador").value.trim();
    const observacao = document.getElementById("observacaoPedido").value.trim();
    const telefoneNumeros = telefone.replace(/\D/g, "");

    if (nome.length < 2 || nome.length > 100 || !telefone) {
        alert("Preencha seu nome e WhatsApp para continuar.");
        return;
    }
    if (!/^[0-9]{10,13}$/.test(telefoneNumeros)) {
        alert("Informe um WhatsApp válido com DDD.");
        return;
    }
    if (observacao.length > 500) {
        alert("A observação pode ter no máximo 500 caracteres.");
        return;
    }
    if (carrinho.length > 20) {
        alert("O pedido pode ter no máximo 20 itens diferentes.");
        return;
    }

    const total = carrinho.reduce((acc, i) => acc + (i.produto.preco * i.qtd), 0);
    if (total <= 0 || total > 100000) {
        alert("O total do pedido não é válido.");
        return;
    }
    let linhas = "";
    carrinho.forEach((i, idx) => {
        linhas += `📦 ${idx + 1}. ${i.produto.nome}\n   Qtd: ${i.qtd} × R$ ${Number(i.produto.preco).toFixed(2)} = R$ ${(i.produto.preco * i.qtd).toFixed(2)}\n\n`;
    });

    const blocoObservacao = observacao ? `📝 *Observação:* ${observacao}\n\n` : "";
    let pedidoCodigo = "";

    try {
        pedidoCodigo = await salvarPedidoCatalogo(nome, telefoneNumeros, observacao, total);
    } catch (erro) {
        console.error("Erro ao registrar pedido:", erro);
        alert("Não foi possível registrar o pedido agora. Vou abrir o WhatsApp mesmo assim.");
    }

    const mensagem = encodeURIComponent(
`🖨️ *Novo Pedido - LV Maker 3D*

👤 Cliente: ${nome}
📞 WhatsApp: ${telefone}
${pedidoCodigo ? `🧾 Código: ${pedidoCodigo}\n` : ""}

${linhas}${blocoObservacao}💰 *Total: R$ ${total.toFixed(2)}*

Aguardo confirmação! 🙌`
    );

    window.open(`https://wa.me/${SEU_WHATSAPP}?text=${mensagem}`, "_blank");
    if (pedidoCodigo) {
        carrinho = [];
        atualizarCarrinho();
        fecharCarrinho();
        document.getElementById("nomeComprador").value = "";
        document.getElementById("telefoneComprador").value = "";
        document.getElementById("observacaoPedido").value = "";
    }
}

function enviarSugestao() {
    const texto = document.getElementById("sugestaoTexto").value.trim();
    const nome = document.getElementById("sugestaoNome").value.trim();
    const telefone = document.getElementById("sugestaoTelefone").value.trim();

    if (!texto || !nome || !telefone) {
        alert("Preencha o que você procura, seu nome e WhatsApp.");
        return;
    }

    const mensagem = encodeURIComponent(
`🔍 *Sugestão de Produto - LV Maker 3D*

👤 Cliente: ${nome}
📞 WhatsApp: ${telefone}

📝 O que procura:
${texto}`
    );

    window.open(`https://wa.me/${SEU_WHATSAPP}?text=${mensagem}`, "_blank");
}

carregarProdutos();
